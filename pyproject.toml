[project]
name = "castalia"
version = "0.1.0"
description = "A beets inspired rom management system without DAT files"
readme = "README.md"
authors = [
    { name = "TheWolf2068", email = "29edt9l2@4wrd.cc" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "toml>=0.10.2",
]

[project.scripts]
castalia = "castalia:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
reportUnusedCallResult = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportAny = false
reportExplicitAny = false
reportUnknownArgumentType = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
